# Checks before every commit and push; run `pre-commit install --hook-type
# pre-commit --hook-type pre-push` once per clone.
#   ruff    before each commit, in its own environment pinned to the version
#           of requirements-lock.txt (keep the two equal);
#   pytest  before each push, in the project environment (.venv when present).
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check
        language: python
        additional_dependencies: ["ruff==0.16.9"]
        types: [python]
      - id: pytest
        name: pytest
        # the project environment when there is one (IDEs do not always put
        # it on PATH), else whatever python is on PATH
        entry: bash -c 'if [ -x .venv/bin/python ]; then .venv/bin/python -m pytest -q; else python -m pytest -q; fi'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
