# The settings of X_M calc.R: with these, ikob2.envelope reproduces
# data/envelope/reference_budgets_x_m_calc.csv (EUR per home-based tour).
#   python -m ikob2.cli.envelope --params envelope/x_m_calc.toml --data-root <root> build
[envelope]
aggregates = "2023"
unit = "tour"
n_lower = "fixed"
spread = "all"
gamma_anchor = 0.5
income_bridge = "none"
quantile_kappa = true
price_base = "published"
income_year = 2023
car_all_tariffs = false
