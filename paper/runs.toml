# Run plan of the paper (docs/paper_runs.md):
#   python -m ikob2.cli.batch --plan paper/runs.toml --data-root <root> --jobs 2
# Tariff and zone tables are names under <root>/inputs/tariffs (seeded from
# data/tariffs by `cli.layout create`).

[specs]                    # impedance specifications (docs/model_theory.md)
m0 = ["--spec", "m0"]
m0u = ["--spec", "m0u"]
m0s = ["--spec", "m0s"]
m1 = ["--spec", "m1"]
m1p = ["--spec", "m1p"]
m2 = ["--spec", "m2"]
"m3t1.25" = ["--spec", "m3", "--theta", "1.25"]
"m3t1.5" = ["--spec", "m3", "--theta", "1.5"]
m3t2 = ["--spec", "m3", "--theta", "2"]
m3t4 = ["--spec", "m3", "--theta", "4"]
m3tinf = ["--spec", "m3", "--theta", "inf"]

[scenarios]                # docs/scenarios.md
s0 = []
s1 = ["--price-scales", "lime_price_scales_all_50.csv"]
s1a = ["--price-scales", "lime_price_scales_d2_d4_50.csv"]
s2c = ["--set", 'shared_bike.egress_suffix={lime="_s2c"}']
s2t = ["--set", 'shared_bike.egress_suffix={lime="_s2t"}']
s3c = ["--price-scales", "lime_price_scales_all_50.csv", "--set", 'shared_bike.egress_suffix={lime="_s2c"}']
s3t = ["--price-scales", "lime_price_scales_all_50.csv", "--set", 'shared_bike.egress_suffix={lime="_s2t"}']
s4 = ["--price-scales", "lime_price_scales_all_50.csv", "--price-zones", "lime_price_zones_overvecht_kanaleneiland.csv"]
s4a = ["--price-scales", "lime_price_scales_d2_d4_50.csv", "--price-zones", "lime_price_zones_overvecht_kanaleneiland.csv"]

# PT chains with shared bicycles, jobs matched to income: every specification
# and scenario
[[sets]]
prefix = "sp"
specs = "all"
scenarios = "all"
args = ["--modes", "pt", "--shared-bike", "v2", "--ownership", "--set", "accessibility.export=false"]

# the controlled comparison (every segment reaches every job)
[[sets]]
prefix = "spc"
specs = "all"
scenarios = ["s0", "s1", "s1a", "s2c", "s2t", "s4", "s4a"]
args = ["--modes", "pt", "--shared-bike", "v2", "--ownership", "--common-jobs", "--set", "accessibility.export=false"]

# time only (reachability gap); M0u and M0s share M0's, M3 M2's
[[sets]]
prefix = "spt"
specs = ["m0", "m1", "m1p", "m2"]
scenarios = ["s0", "s2c", "s2t"]
args = ["--modes", "pt", "--shared-bike", "v2", "--ownership", "--no-cost-gate", "--set", "accessibility.export=false"]

# M2 with every mode, Lime usage and public cost, and the analysis products
[[sets]]
name = "{prefix}_{scenario}"
prefix = "scen"
specs = ["m2"]
scenarios = "all"
args = ["--modes", "car", "bike", "pt", "--shared-bike", "v2", "--ownership", "--report-usage"]

# residents without a private bicycle (bicycle ownership 0 everywhere)
[[sets]]
name = "{prefix}_{scenario}_nobike"
prefix = "scen"
specs = ["m2"]
scenarios = ["s0", "s1", "s1a", "s2c", "s2t", "s4", "s4a"]
args = ["--modes", "pt", "--shared-bike", "v2", "--ownership", "--bike-ownership", "{root}/inputs/veh_owners/bike_ownership_buurten_zero.csv", "--report-usage"]
