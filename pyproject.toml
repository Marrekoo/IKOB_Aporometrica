[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ikob2"
version = "0.1.0"
description = "IKOB Aporometrica: threshold-gate accessibility modelling engine"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyogrio>=0.7",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
routing = ["r5py>=1.1", "pyvalhalla>=3.9"]   # R5 (Java 21) and a local Valhalla server
legacy = ["openpyxl>=3.1"]   # read the Excel inputs (LISA, IKOB job table)

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ikob2" = ["defaults.toml"]
"ikob2.skims" = ["*.csv"]
