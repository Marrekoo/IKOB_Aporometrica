[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ikob2"
version = "0.1.0"
description = "IKOB Aporometrica: threshold-gate accessibility modelling engine"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyogrio>=0.7",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
