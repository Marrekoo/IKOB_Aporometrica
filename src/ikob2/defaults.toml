# Default values of every model and run parameter. This file is the single
# place where they are written down; the code contains no numeric
# assumptions of its own. Override a value by (in increasing priority)
#   1. a parameter file:   --params my_params.toml   (same layout, partial)
#   2. a single value:     --set pt.walk_kmh=4.5
#   3. a dedicated flag:   --walk-kmh 4.5
# A run writes the resolved values to run.json. Unknown keys are errors.

[paths]
# Data folder (see utils/paths.py). Empty: taken from $IKOB_DATA_ROOT or
# --data-root; there is no built-in location.
data_root = ""
study = "utrecht_nl"       # skim store under intermediate/skims (--study)
# Reference files: a name is looked up in its folder of the data layout (a path
# that exists as given is used as it is); `cli.layout create` seeds these
# folders from the repository's data/ folder.
budgets = "reference_budgets.csv"                     # under inputs/envelope
# multipliers on the Lime price by household type / income class (concessions such
# as the U-pas); rows "household_type,income_class,scale", "*" = all, later rows
# override earlier ones; "" = none
lime_price_scales = "lime_price_scales.csv"           # under inputs/tariffs
# multipliers on the public transport FARE by household type / income class (concessions);
# same layout; "" = none
pt_fare_scales = ""                                   # under inputs/tariffs
# buurten (column buurtcode) whose RESIDENTS get the Lime price scales (a concession
# by home address); "" = every origin
lime_price_zones = ""                                 # under inputs/tariffs
kwb_version = "v3"
car_availability_study = "utrecht"
osm_national = "netherlands-260822.osm.pbf"          # under inputs/osm
osm_regions = ["utrecht", "noord-holland", "zuid-holland", "flevoland"]   # <name>.osm.pbf
survey_margins = "S_T_work.csv"                       # under inputs/survey: Weibull time margins
bike_ownership = "bike_ownership_buurten.csv"         # under inputs/veh_owners
lisa = "LISA_Gemeenten_2025.xlsx"                     # under inputs/lisa
ikob_jobs = "Alle_Zones_2030_2040.xlsx"               # under inputs/ikob: buurt job totals
education_jobs = "Ralph_Sahar_CBS_buurten_met_banen_naar_opleidingsniveau.xlsx"   # under inputs/ikob
odin = "ODIN_22_23_clean.csv"                         # under inputs/odin

[vot]                      # EUR per hour (LMS/NRM), used by M1
car = 12.05
pt = 15.10                 # rail
pt_other = 10.80           # bus, tram, metro

[accessibility]
spec = "m2"                # m0, m0u, m0s, m1, m1c, m1p, m2, m3 (segments/specs.py)
m1c_cost_mean_eur = 0.0    # M1c: mean acceptable cost (EUR per trip); 0 = median of the segment means
cutoff_share = 0.5         # M0, M0u, M0s: the cut-offs are the thresholds this share of people reaches (0.5 = median)
m0u_cost_cutoff_eur = 0.0  # M0u: one cost cut-off (EUR per trip); 0 = the cut-off of the population's cost thresholds
copula = "independence"    # M2: independence, gumbel, frank, comonotone, countermonotone
theta = 1.5                # Gumbel-Hougaard (M3, --copula gumbel) or Frank
epsilon = 1e-9             # sparsification of composed filters
unreachable_minutes = 1e4  # fill for unreachable pairs
time_shape = "weibull"     # weibull, exponential, step
cutoff = 45.0              # minutes, for step / exponential
exp_calibration = "mean"   # mean, half
legs_per_tour = 2.2        # one-way journeys per home-based tour: divides a budget table per tour (unit = tour); tables per journey are not divided (docs/segments.md)
censored = "atom"          # atom, drop
population_basis = "population_scaled"
kwb_year = 2022
jobs_year = 2022
wage_period = "2022JJ00"
wfh_period = "2024JJ00"
wfh_types = ["no_wfh", "wfh_possible"]
modes = ["car", "bike"]
cost_gate = true           # false: time-only accessibility
export = true              # write the analysis products (segments, margins, hubs, origins.gpkg, dictionary)
ownership = false          # weight modes by car / bicycle availability
common_jobs = false        # controlled comparison: all segments reach all jobs
shared_bike = []           # variants v0..v4

[car]
default_model = "fossil"
parking_search = true
departure_factor = 0.25    # departure search time as a share of arrival
detour_constant = 1.3      # route/crow-fly factor without a calibrated model
[car.parking_arrival_min]  # by KWB urbanisation class (1 = most urban)
1 = 12.0
2 = 8.0
3 = 4.0
4 = 0.0
5 = 0.0
[car.models.fossil]
variable_eur_per_km = 0.16
[car.models.electric]
variable_eur_per_km = 0.05
[car.models.shared]
variable_eur_per_km = 0.33
per_minute_eur = 0.05
[car.models.taxi]
variable_eur_per_km = 2.40
per_minute_eur = 0.40

[pt]                       # frequency-model router (skims/gtfs_pt.py)
date = "2026-09-15"
window_h = [7.0, 9.0]
walk_kmh = 4.0
walk_detour = 1.3
max_access_min = 20.0
transfer_radius_m = 300.0
wait_cap_min = 7.5
boarding_penalty_min = 0.0
rail_detour = 1.15
other_detour = 1.25
max_minutes = 180.0
gtfs_chunksize = 2000000
block_size = 10            # origins per resumable block in the PT layer
egress_hubs = "file"       # file: the hub_files below; rail: every rail stop; all: every stop
hub_files = ["hubs/utrecht_hubs.csv", "ovfiets/locaties.json"]   # under <data root>/inputs
hub_walk_radius_m = 300.0  # walk from an alighting stop to a hub from a file
hub_kinds = ["lime", "ovfiets"]   # tariff of each file in hub_files (see shared_bike.hub_tariffs)

[bike_leg]                 # bicycle access/egress leg of a PT chain
kmh = 16.0
detour = 1.3
max_minutes = 20.0
fixed_minutes = 1.0

[pt_fare]
rail_eur_per_km_at_1km = 2.60
rail_eur_per_km_at_100km = 0.20
rail_discount = 0.0       # off-peak discounts do not apply: the model is the 7-9 h peak (commuting)
rail_beyond_table = "cap"
regional_boarding_eur = 1.08
regional_eur_per_km = 0.18
boardings = "single"
rail_table = ""            # CSV km,eur; empty: NS 2026 table shipped with the package
rail_anchors = false       # true: power law through the two anchors above

[shared_bike]
ovfiets_eur = 4.80
dockless_unlock_eur = 1.00
dockless_per_min_eur = 0.20
# how a dockless (access) rental is priced: "lime_tiers" (baseline, from Jan 2026),
# "unlock_per_minute" (unlock fee + rate per riding minute) or "flat"
dockless_model = "lime_tiers"
lime_scale = 1.0           # multiplier on every Lime price (S1: 0.5)
flat_eur = 0.0             # dockless_model "flat": EUR per rental; 0 = calibrate for revenue neutrality
report_usage = false      # record the Lime revenue and rentals of the run (v2) in run.json
flat_method = "fixed_point"   # calibration: fixed_point (revenue neutral after behaviour) or weighted_mean (baseline volumes)
flat_tol_eur = 0.005       # fixed point: tolerance of the flat price (EUR)
flat_max_evals = 30        # fixed point: most usage evaluations
flat_bracket_step = 1.15   # fixed point: factor by which the bracket around the price widens
# Lime (municipal hubs, from Jan 2026, RTV Utrecht 2025-11-03): price by rental
# duration, [longest minutes, EUR]; rental minutes = ride + fixed minutes
lime_tiers = [[20.0, 3.0], [30.0, 4.0], [40.0, 5.0]]
hub_tariffs = ["ovfiets", "lime"]      # known hub tariff kinds (pt.hub_kinds, egress_hub_kinds)
egress_suffix = {}                     # skim mode suffix per hub kind, e.g. {lime = "_s2"} reads pt_wb_lime_s2
egress_hub_kinds = ["lime", "ovfiets"]   # egress skim modes pt_wb_<kind>, pt_bb_<kind>; [] = plain pt_wb, pt_bb

[skims]
near_km = 50.0
far_cells = "municipality"
walk_model = "zone"
departure = "2026-09-01T08:00:00"
window_minutes = 60
block_size = 25
walk_kmh = 4.8
walk_detour = 1.3
walk_max_minutes = 30.0
intrazonal_factor = 0.52   # mean distance of two random points = factor * sqrt(area)
cycle_kmh = 16.0
percentile = 50
max_rides = 4
[skims.max_minutes]
car = 120
bike = 90
walk = 30
pt = 180

[numerics]
use_sparse = true          # store composed filters as CSR when sparse enough
sparse_max_density = 0.25  # share of non-zero entries above which a filter stays dense
threads = 0                # worker threads of the leg-wise evaluation; 0 = all cores
check_frechet = true       # verify the Frechet-Hoeffding bounds of parametric copulas

[costs]                    # public cost model of the shared-bicycle measures (EUR)
# Cluster of hubs (municipal financial model; the province co-finances the set-up)
hub_cluster_size = 10
hub_setup_eur_cluster = 75000.0            # signage, marking, bicycle parking (once)
province_capex_share = 0.5                 # co-financing of the set-up by the province
hub_rebalancing_eur_year_cluster = 20000.0
hub_enforcement_eur_year_cluster = 5000.0
# The social tariff compensation of the model (18,750 per cluster and year) is a
# price concession: it is the cost side of S1, not of S2, and is not counted here.
hub_tariff_compensation_eur_year_cluster = 18750.0
horizon_years = 5.0        # permit term 3 + 2 years; capex spread over it
discount_rate = 0.0
# Volume: rides of the whole concession area (RTV Utrecht, 2026-09-09): 1.25 million
# in the first 8 months; the fleet is 2,000 bikes in and around Utrecht
rides_observed = 1250000.0
rides_months = 8.0
fleet = 2000.0

[siting]                   # extra hubs of scenario S2
hub_density_factor = 2.0   # doubling: as many new hubs as there are municipal hubs
min_spacing_m = 400.0      # no new hub closer than this to another hub
access_mode = "pt"         # baseline accessibility that ranks the buurten (population weighted)
access_weight = 0.5        # weight of low accessibility in the score; the rest is low bicycle ownership
kind = "lime"              # tariff kind of the new hubs
# buurten (column buurtcode) to site the hubs in, e.g. the price zone of S4; a
# path, or a name under inputs/tariffs; "" = every origin buurt
within = ""
n_new = 0                  # number of new hubs; 0: (hub_density_factor - 1) x the existing hubs, or with `within` as many as fit

[distance]                 # car route distances via Valhalla, detour calibration
radius_km = 30.0
origin_batch = 10
dest_batch = 100
calibration_origins = 20
calibration_far = 80
calibration_near = 80
calibration_near_km = 15.0
calibration_seed = 0
calibration_min_pairs = 20
calibration_edges_km = [0.0, 1.0, 3.0, 8.0, 20.0, 50.0, 1e9]
osrm_url = "https://router.project-osrm.org"
osrm_max_table = 100
osrm_retries = 3
osrm_pause = 1.0

[peak]                     # congestion factors by OSM road class (skims/peak.py)
minimum_kmh = 5.0
[peak.factors]
motorway = 1.4
motorway_link = 1.4
trunk = 1.4
trunk_link = 1.4
primary = 1.2
primary_link = 1.2
secondary = 1.2
secondary_link = 1.2
tertiary = 1.05
tertiary_link = 1.05
residential = 1.05
unclassified = 1.05
living_street = 1.05

[segments]
income_period = "2022JJ00"     # CBS 86161NED
children_period = "2022JJ00"   # CBS 71487ned
ipf_tol = 1e-8
ipf_max_iter = 200
single_parent_fallback_share = 0.20
kwb_no_child_includes_single = false
local_income_calibration = "laagste40"
structure_min_rows = 10
structure_min_gemeenten = 10
low_income_classes = ["D1", "D2", "D3", "D4"]
[segments.hh_size]
single = 1.0
couple = 2.0
single_parent = 2.4
couple_children = 3.6
[segments.fallback_hh_composition]
single = 0.40
couple = 0.30
single_parent = 0.06
couple_children = 0.24

[jobs]
# placing jobs in the income-decile pools: "occupation" = sector x ISCO major
# group cells with a lognormal wage spread and home working by occupation
# (segments/occupations.py, data/occupations); "sector" = every job of a
# sector at the sector's mean wage, home working by the sector's education mix
matching = "occupation"
occupation_year = "2022"   # year of the LFS, SES and 85517NED occupation tables (cli.segments occupations)
establishment_weight = 0.25   # weight of the establishment seed (jobs imputation)
train_year = 2016             # LISA year matching the education shares
ikob_jobs_year = "2018"       # year column of the IKOB job table (buurt totals)
kwb_establishments_table = "85318NED"   # StatLine KWB table with establishments by SBI group
tol = 1e-8
max_iter = 500

[ownership]                # car availability and PT fare spending from ODiN
municipality = 344         # CBS municipality number of the study area (344 = Utrecht)
car_basis = "household_car"   # household_car, car_and_licence
car_prior = 30.0           # respondents of prior weight for the national cell
pt_spend_prior = 100.0     # persons of prior weight for the national rate

[servers]
valhalla_port = 8002
valhalla_concurrency = 6
valhalla_start_concurrency = 4
valhalla_wait_seconds = 120.0
valhalla_max_distance = 5000000.0
valhalla_max_locations = 20000
valhalla_max_matrix_distance = 80000.0
valhalla_max_matrix_location_pairs = 20000
otp_port = 8080
otp_version = "2.8.1"
otp_service_start = "2026-09-01"
otp_service_end = "2026-09-30"
otp_build_heap = "11G"
otp_heap = "8G"

[envelope]                 # reference-budget envelope (ikob2.envelope; docs: envelope/README.md)
sources = "sources"        # folder of source tables under inputs/envelope
odin = ["ODIN_23.csv"]     # ODiN files under inputs/odin for the tour rates (the envelope of Table 6 uses 2023)
rent_lineage = "tussenrapport"
gamma_grid = [0.0, 0.25, 0.5, 0.75, 1.0]   # share of the example basket given up for mobility
n_min_fixed = 8.0          # lower bound on priced home-based tours per household and month
slack_min_eur = 25.0       # example minus minimum basket above which gamma is identified
slack_tol = 1e-6
sp_donors = ["single", "couple_children"]   # households whose basket slack is lent to single parents
sp_donor_point = "couple_children"
income_measure = "gest"    # CBS percentiles: gest (standardised) or disp
income_year = 2023         # CBS incomes: the year of the Nibud minima (2023); price_base sets the price level
top_decile_rule = "pareto_p95"   # pareto_p95 or boundary_p90
# ---- the method's choices (envelope/README.md; sensitivity: envelope/switches.py)
aggregates = "2022_2023"        # ODiN aggregates under inputs/envelope/odin/: 2023 or 2022_2023
unit = "journey"           # budget per priced home-based tour, or per priced one-way "journey"
n_lower = "lowest_decile"  # lower bound on tours per month: fixed (n_min_fixed) or lowest_decile of the household type
spread = "gamma"           # low/high over all scenario assumptions, or over "gamma" only (others central)
gamma_anchor = 0.5         # where Warnaar's b_norm lies: 0.5 (midpoint of the two residuals) or 0 (the example-basket residual)
income_bridge = "per_adult" # none or per_adult: add the basic health premium per adult to CBS incomes
basic_premium_eur = 137.75 # average nominal basic health premium 2023, EUR/month per adult
quantile_kappa = true      # published price base only: uprate the decile baskets by kappa or not
price_base = "2022"        # published (each input at its own price date) or "2022": every amount in 2022 euros (CPI), the price level of the KWB population year
car_all_tariffs = true     # car options in every PT-tariff scenario (false: only in the first, "chipkaart")
boardings_per_journey = 1
slack_share = 0.95         # gate_slack flag: the high budget reaches more than this share of tours
days_per_month = 30.44
months_per_year = 12
min_band_n = 150           # persons for a household-type x decile x age-band tour rate
min_commuter_n = 50        # persons for a household-type x decile commuting rate
pt_nibud_eur_km = 0.19     # Nibud's implied PT rate, all-in
pt_train_eur_km = 0.26
pt_btm_eur_km = 0.187
pt_btm_board_eur = 1.08
boardings_per_tour = 2
urbanity_adj_eur = 0.0
rent_scenarios = ["lo", "interp", "hi"]
commute_scenarios = ["none", "average", "worker"]
pt_bases = ["nibud_flat", "chipkaart"]

[analysis]                 # cli.compare, cli.interchange, cli.paper_tables
mode = "pt_v2"             # the mode compared
value = "accessibility"    # the column compared
compare_top_share = 0.10   # cli.compare: overlap of the top share of origins
interchange_quantiles = [0.9, 0.1]   # R: the interquantile ratio across an origin's segments
interchange_tol = 1e-9     # R is undefined where |gain(B)| <= this
interchange_min_segments = 3   # origins with fewer defined segments get no dispersion

[diagnostics]              # money-gate curves per origin (outputs/diagnostics.py)
floor = 0.05               # hazard read where the aggregate survival exceeds this share of S(0+)
ttt_band = 0.05            # TTT area above +band: IFR, below -band: DFR, else near-exponential
hazard_increasing = 0.8    # share of rising hazard steps from which the bulk counts as increasing
hazard_decreasing = 0.2    # share at or below which it counts as decreasing

[paper]                    # cli.paper_tables (docs/paper_runs.md)
tags = ["m0", "m0u", "m0s", "m1", "m1p", "m2", "m3t1.25", "m3t1.5", "m3t2", "m3t4", "m3tinf"]
scenarios = ["s1", "s1a", "s2c", "s2t", "s3c", "s3t", "s4", "s4a"]
pairs = ["s1:s2c", "s4:s2t"]   # R = gain(A) / gain(B)
gap_scenarios = ["s1", "s1a", "s4", "s4a"]   # price scenarios after which the reachability gap is reported
targeting = ["S1=scen_s1", "S1a=scen_s1a", "S4=scen_s4", "S4a=scen_s4a"]   # label=run of the targeting tables
base_run = "scen_s0"       # baseline run of the targeting tables
target_classes = ["D2", "D3", "D4"]
zone = "lime_price_zones_overvecht_kanaleneiland.csv"   # under inputs/tariffs
